excluded:
  - ${PWD}/Carthage
  - ${PWD}/Pods
  - ${PWD}/DerivedData

disabled_rules:
    - trailing_comma
    - opening_brace
    - unused_enumerated
    - multiple_closures_with_trailing_closure
    - trailing_whitespace
    - todo

opt_in_rules:
    - attributes
    - closure_body_length
    - closure_end_indentation
    - closure_spacing
    - collection_alignment
    - comma_inheritance
    - conditional_returns_on_newline
    - contains_over_filter_count
    - contains_over_filter_is_empty
    - contains_over_first_not_nil
    - contains_over_range_nil_comparison
    - convenience_type
    - discarded_notification_center_observer
    - discouraged_assert
    - discouraged_none_name
    - discouraged_object_literal
    - empty_collection_literal
    - empty_string
    - enum_case_associated_values_count
    - expiring_todo
    - explicit_init
    - fallthrough
    - fatal_error_message
    - file_name_no_space
    - first_where
    - flatmap_over_map_reduce
    - ibinspectable_in_extension
    - identical_operands
    - implicit_return
    - indentation_width
    - last_where
    - let_var_whitespace
    - literal_expression_end_indentation
    - local_doc_comment
    - lower_acl_than_parent
    - modifier_order
    - multiline_arguments
    - multiline_arguments_brackets
    - multiline_function_chains
    - multiline_literal_brackets
    - multiline_parameters
    - multiline_parameters_brackets
    - operator_usage_whitespace
    - optional_enum_case_matching
    - overridden_super_call
    - override_in_extension
    - period_spacing
    - prefer_self_in_static_references
    - prefer_self_type_over_type_of_self
    - prefer_zero_over_explicit_init
    - private_subject
    - prohibited_super_call
    - reduce_into
    - redundant_nil_coalescing
    - redundant_type_annotation
    - required_enum_case
    - return_value_from_void_function
    - self_binding
    - shorthand_optional_binding
    - sorted_first_last
    - static_operator
    - toggle_bool
    - type_contents_order
    - unneeded_parentheses_in_closure_argument
    - unhandled_throwing_task
    - unowned_variable_capture
    - untyped_error_in_catch
    - vertical_parameter_alignment_on_call
    - vertical_whitespace_between_cases
    - vertical_whitespace_closing_braces
    - vertical_whitespace_opening_braces
    - yoda_condition


type_contents_order:
  order:
    - case
    - associated_type
    - type_alias
    - type_property
    - type_method
    - ib_inspectable
    - ib_outlet
    - instance_property
    - subscript
    - initializer
    - view_life_cycle_method
    - other_method
    - ib_action
    - subtype
    - deinitializer

trailing_whitespace:
  ignores_empty_lines: true

indentation_width:
  include_comments: false
  include_multiline_strings: false
  severity: error

statement_position:
  statement_mode: uncuddled_else
  severity: error

line_length:
  warning: 180
  ignores_urls: true

redundant_void_return:
  include_closures: false

type_body_length:
  warning: 350
  error: 350

nesting:
  function_level: 1
  type_level: 5 # Можно поднять, если есть проблема с енамами неймспейсами

identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 50
    error: 60

type_name:
  min_length:
    warning: 2
    error: 2
  max_length:
    warning: 65
    error: 65

generic_type_name:
  max_length:
    warning: 25
    error: 30

large_tuple:
  warning: 4
  error: 4

cyclomatic_complexity:
  ignores_case_statements: true

function_body_length:
  warning: 120
  error: 200

closure_body_length:
  warning: 50
  error: 60

enum_case_associated_values_count:
  warning: 6
  error: 6

file_length:
  warning: 500
  error: 600

function_parameter_count:
  warning: 8
  error: 10

attributes: error
closure_end_indentation: error
closure_spacing: error
collection_alignment: error
convenience_type: error
discarded_notification_center_observer: error
discouraged_object_literal: error
explicit_init: error
fallthrough: error
file_name_no_space: error
ibinspectable_in_extension: error
identical_operands: error
let_var_whitespace: error
literal_expression_end_indentation: error
local_doc_comment: error
lower_acl_than_parent: error
modifier_order: error
multiline_arguments: error
multiline_arguments_brackets: error
multiline_literal_brackets: error
multiline_parameters: error
multiline_parameters_brackets: error
operator_usage_whitespace: error
overridden_super_call: error
override_in_extension: error
period_spacing: error
prefer_self_type_over_type_of_self: error
prohibited_super_call: error
reduce_into: error
redundant_nil_coalescing: error
return_value_from_void_function: error
self_binding: error
shorthand_optional_binding: error
unneeded_parentheses_in_closure_argument: error
unowned_variable_capture: error
vertical_parameter_alignment_on_call: error
vertical_whitespace_between_cases: error
vertical_whitespace_closing_braces: error
vertical_whitespace_opening_braces: error
yoda_condition: error
